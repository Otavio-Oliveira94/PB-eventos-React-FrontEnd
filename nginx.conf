resolver 127.0.0.11 valid=10s ipv6=off;

upstream eventos_backend {
    zone eventos_backend 64k;
    server eventos-service:8080 resolve;
}

upstream inscricoes_backend {
    zone inscricoes_backend 64k;
    server inscricoes-service:8081 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/eventos-service/ {
        proxy_pass http://eventos_backend/;
    }

    location /api/inscricoes-service/ {
        proxy_pass http://inscricoes_backend/;
    }

    location /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}