name: CI - Eventos Frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Build do frontend e imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar as dependencias
        run: npm ci

      - name: Gerar o build de producao
        run: npm run build

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar a construcao da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: eventos-express/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
